name: Build APK

'on':
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android tools
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Download native libraries
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/xentron-bit/llama-android-prebuilt.git /tmp/llama-prebuilt
          mkdir -p app/src/main/cpp/prebuilt
          cp -r /tmp/llama-prebuilt/include app/src/main/cpp/prebuilt/
          cp -r /tmp/llama-prebuilt/jniLibs app/src/main/cpp/prebuilt/
          echo "===== Native libraries downloaded ====="
          find app/src/main/cpp/prebuilt/jniLibs -type f -name '*.so' -print

      - name: Build APK and show errors
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail

          gradle assembleDebug \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            --no-daemon 2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "========== BUILD ERROR DETAILS =========="
            grep -n -B 12 -A 30 -E \
              'CMake Error|fatal error:|error:|^e: |What went wrong|Execution failed for task|Cannot find|already exists|not found' \
              build.log | head -n 300 || true
            echo ""
            echo "========== END ERROR DETAILS =========="
          else
            echo "BUILD SUCCESSFUL"
          fi

          exit "$RESULT"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Mark failed build
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          echo "BUILD FAILED. Read the BUILD ERROR DETAILS above."
          exit 1
