name: Build APK

'on':
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download native libraries
        run: |
          git clone --depth 1 https://github.com/xentron-bit/llama-android-prebuilt.git /tmp/llama-prebuilt
          mkdir -p app/src/main/cpp/prebuilt
          cp -r /tmp/llama-prebuilt/include app/src/main/cpp/prebuilt/
          cp -r /tmp/llama-prebuilt/jniLibs app/src/main/cpp/prebuilt/
          echo "=== Downloaded headers ==="
          ls -la app/src/main/cpp/prebuilt/include
          echo "=== Downloaded libraries ==="
          ls -la app/src/main/cpp/prebuilt/jniLibs/arm64-v8a

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
