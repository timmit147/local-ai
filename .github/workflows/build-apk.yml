name: Build APK

'on':
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download native libraries
        run: |
          git clone --depth 1 https://github.com/xentron-bit/llama-android-prebuilt.git /tmp/llama-prebuilt
          mkdir -p app/src/main/cpp/prebuilt
          cp -r /tmp/llama-prebuilt/include app/src/main/cpp/prebuilt/
          cp -r /tmp/llama-prebuilt/jniLibs app/src/main/cpp/prebuilt/
          find app/src/main/cpp/prebuilt -maxdepth 3 -type f | head -80

      - name: Configure CMake and show exact error
        run: |
          set -o pipefail
          cmake -S app/src/main/cpp -B /tmp/pocketai-cmake \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=29 \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_NDK="$ANDROID_HOME/ndk/27.0.12077973" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DCMAKE_MAKE_PROGRAM="$ANDROID_HOME/cmake/3.22.1/bin/ninja" \
            -DCMAKE_CXX_FLAGS="-std=c++17" \
            -GNinja 2>&1 | tee /tmp/cmake-error.log

      - name: Build APK
        if: success()
        run: gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
