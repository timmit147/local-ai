name: Build APK

'on':
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Download native libraries
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/xentron-bit/llama-android-prebuilt.git /tmp/llama-prebuilt
          mkdir -p app/src/main/cpp/prebuilt
          cp -r /tmp/llama-prebuilt/include app/src/main/cpp/prebuilt/
          cp -r /tmp/llama-prebuilt/jniLibs app/src/main/cpp/prebuilt/
          find app/src/main/cpp/prebuilt -type f | sort

      - name: Build APK with full diagnostics
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build-diagnostics
          java -version 2>&1 | tee build-diagnostics/environment.txt
          gradle --version 2>&1 | tee -a build-diagnostics/environment.txt

          set +e
          set -o pipefail
          gradle assembleDebug \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            --no-daemon \
            2>&1 | tee build-diagnostics/full-build.log
          RESULT=${PIPESTATUS[0]}
          set -e

          echo "$RESULT" > build-diagnostics/exit-code.txt

          grep -n -i -E \
            '(^e: |error:|fatal error:|unresolved reference|type mismatch|expecting |Execution failed for task|Task .* FAILED|CMake Error|ninja: error|What went wrong|Caused by:|BUILD FAILED)' \
            build-diagnostics/full-build.log \
            > build-diagnostics/errors-summary.txt || true

          echo "Build exit code: $RESULT"
          echo "===== ERROR SUMMARY ====="
          cat build-diagnostics/errors-summary.txt || true
          exit "$RESULT"

      - name: Save source files for diagnosis
        if: always()
        run: |
          mkdir -p build-diagnostics/source-info
          for file in \
            app/build.gradle.kts \
            app/src/main/cpp/CMakeLists.txt \
            app/src/main/cpp/vision_bridge.cpp \
            app/src/main/java/com/example/pocketai/VisionEngine.kt \
            .github/workflows/build-apk.yml
          do
            if [ -f "$file" ]; then
              cp --parents "$file" build-diagnostics/source-info/
            fi
          done

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ai-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Mark failed build
        if: steps.build.outcome != 'success'
        run: |
          echo "Build failed. Download pocket-ai-build-diagnostics from the Artifacts section."
          exit 1
