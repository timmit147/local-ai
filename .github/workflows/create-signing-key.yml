name: Create Pocket AI signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate signing key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Add the two password secrets before running this workflow."
            exit 1
          fi

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/pocket-ai.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias pocketai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Pocket AI"

          echo "Key generated successfully, but it still needs to be stored securely."
