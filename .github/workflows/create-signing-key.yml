name: Create Pocket AI signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and export signing key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/pocket-ai.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias pocketai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Pocket AI"

          echo "Keystore created. It must now be stored in GitHub Secrets."
          echo "No private key will be published as a build artifact."
